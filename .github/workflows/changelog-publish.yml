name: Changelog publish

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"

concurrency:
  group: changelog-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # need the `before` commit for `git show <before>:CHANGELOG.md`
          persist-credentials: false

      - uses: ./actions/publish-changelog
        with:
          source: src_LNrMz-rrFa2OD27mBUfaT
          api-token: ${{ secrets.RELEASES_API_KEY }}
          url-template: https://releases.sh/updates/{date}
